<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Dashboard Modern</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 min-h-screen flex">

<div class="w-64 bg-white shadow-lg p-6 flex flex-col sidebar">
    <h2 class="text-xl font-bold mb-6 text-indigo-600">Dashboard</h2>
    <nav class="flex flex-col space-y-2">
        <a href="#" class="text-gray-700 hover:text-indigo-600">Home</a>
        <a href="#" class="text-gray-700 hover:text-indigo-600">Profile</a>
        <a href="#" class="text-gray-700 hover:text-indigo-600">Settings</a>
        <a href="index.html" id="logoutBtn" class="text-red-500 hover:text-red-700 mt-4">Logout</a>
    </nav>
</div>

<div class="flex-1 p-10 main-content">
    <h1 class="text-3xl font-bold text-gray-800 mb-4">Selamat Datang di Dashboard!</h1>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
        <div class="card bg-white p-6 rounded-lg shadow-lg">Users: <span id="users">0</span></div>
        <div class="card bg-white p-6 rounded-lg shadow-lg">Messages: <span id="messages">0</span></div>
        <div class="card bg-white p-6 rounded-lg shadow-lg">Notifications: <span id="notifications">0</span></div>
    </div>

    <canvas id="chart" class="bg-white p-6 rounded-lg shadow-lg"></canvas>
</div>

<script src="app.js"></script>
</body>
</html>
