<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Login Modern JWT</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body class="bg-gradient-to-r from-purple-500 to-indigo-600 flex items-center justify-center min-h-screen">

<div class="bg-white p-8 rounded-xl shadow-xl w-full max-w-md login-card opacity-0">
    <h2 class="text-3xl font-bold text-center text-indigo-600 mb-6">Login</h2>

    <form id="loginForm" class="space-y-4">
        <input type="text" id="username" placeholder="Username" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-400">
        <input type="password" id="password" placeholder="Password" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-400">
        <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700 transition">Login</button>
    </form>

    <p id="message" class="text-red-500 text-center mt-2"></p>
    <p class="mt-4 text-center text-sm">Belum punya akun? <a href="register.html" class="text-indigo-600 hover:underline">Daftar</a></p>
</div>

<script src="app.js"></script>
</body>
</html>
